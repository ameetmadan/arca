# SEC-001. Separate from build.yml so the weekly run doesn't rebuild the app;
# advisories land without code changes and only the schedule catches them.
name: Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Reports only vulnerabilities whose vulnerable symbols are reachable, and exits
      # non-zero when it finds one. The llamacpp tag needs llama.cpp headers, so it is skipped.
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags sqlitevec,duckdb ./...
